[package]
name = "onopen"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "See what runs when you open a repository. Finds config files that execute commands on folder open, install, or agent start."
authors = ["Veltron"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/NULVEC/onopen"
homepage = "https://veltron.cc/onopen"
keywords = ["security", "supply-chain", "scanner", "static-analysis", "devsecops"]
categories = ["command-line-utilities", "development-tools"]
# The crate ships what someone consuming onopen needs. The test suite stays in
# the repository: its fixtures are a deliberately hostile repository, and a
# published package carrying files full of `curl | sh` is one that trips
# scanners for no benefit. Shipping the tests without their fixtures would be
# worse still — they would simply fail.
exclude = [
    "/tests",
    "/.github",
    "/.onopenignore",
    "/.gitattributes",
    "/.gitignore",
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.19"
# 0.4.30 uses let-chains stabilized after our Rust 1.85 MSRV.
ignore = "=0.4.23"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8.23"
walkdir = "2.5.0"
yaml-rust2 = "0.11.0"

# cargo-binstall reads this to fetch the binary a release already built instead
# of compiling the crate. The shape has to match what release.yml produces:
# `onopen-<version>-<target>` as the archive stem, and the binary one directory
# down inside it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
