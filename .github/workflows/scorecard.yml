name: scorecard

# OpenSSF Scorecard grades the practices around the code: pinned actions,
# token permissions, branch protection, signed releases, dependency policy.
# A tool that asks to be trusted on other people's repositories should publish
# how its own is run, and have the grade drop visibly if that slips.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to the Security tab.
      security-events: write
      # Publish them to the public Scorecard API and badge, signed.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
