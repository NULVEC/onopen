name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: minimum Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --all-targets --locked

  deny:
    name: dependency advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Covers what `cargo audit` does and the part it does not: the licences in
      # the tree, and whether anything is pulled from a registry or a git
      # remote that this project never agreed to. The policy is in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  test:
    name: test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo test --all-targets
      - run: cargo test --doc

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  scale:
    name: scan a large repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release

      # A real tree, not a generated one: what costs time is the shape of a
      # repository people actually have — deep nesting, a large .gitignore, and
      # thousands of directories that hold no configuration at all.
      - name: Clone a repository of a realistic size
        run: git clone --depth 1 https://github.com/microsoft/TypeScript.git /tmp/subject

      # The ceiling is deliberately loose. It is not a benchmark and it is not
      # trying to measure a few hundred milliseconds on a shared runner: it is
      # there to fail when a change makes the walk quadratic, which is the way
      # this gets slow. A scan someone has to wait for is a scan they stop
      # running.
      - name: Scan it, with a ceiling
        run: |
          set -euo pipefail
          time timeout 120 ./target/release/onopen /tmp/subject --quiet --no-fail

  dogfood:
    name: scan this repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # onopen on onopen. The hostile fixtures are silenced by the repository's
      # own .onopenignore — they are test data, not configuration this project
      # runs — so anything reported here is a real execution path added to
      # onopen itself, and the build should stop.
      - run: cargo run --release -- . --explain

      # And the fixtures must keep tripping it, or a detection has regressed.
      - name: fixtures still detected
        run: |
          if cargo run --release -- tests/fixtures/trapped --quiet; then
            echo "::error::trapped fixture no longer reports execution paths"
            exit 1
          fi
