name: release

# Tagging is the only trigger. A release should be a deliberate act, not
# something that happens because a commit landed on main.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      # A binary that fails its own test suite has no business being published.
      - run: cargo test --all-targets

      - run: cargo build --release --target ${{ matrix.target }}

      # One archive shape per platform, named so a download URL can be built
      # from the target triple alone.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stem="onopen-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stem}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/onopen.exe" "dist/${stem}/"
          else
            cp "target/${{ matrix.target }}/release/onopen" "dist/${stem}/"
          fi
          cp README.md LICENSE "dist/${stem}/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${stem}.zip" "${stem}" > /dev/null
          else
            tar -czf "${stem}.tar.gz" "${stem}"
          fi
          rm -rf "${stem}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance is the point: a security tool asking to be run on other
      # people's repositories should be able to prove which workflow, from
      # which commit, produced the binary they downloaded.
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/onopen-*"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # `uses: NULVEC/onopen@v0` is how an action is normally pinned, and it only
  # works if a major tag follows the latest release in that series. Moving it
  # is deliberate: someone who pinned @v0 asked for the newest v0.x.
  major-tag:
    needs: [publish, publish-crate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          major="v${GITHUB_REF_NAME#v}"
          major="${major%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push -f origin "${major}"

  publish-crate:
    name: publish crates.io
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@bc540ba06a4ccee415bb241490e0b25ee8e7d315 # stable
      # crates.io has no pending-publisher flow: a crate has to exist before
      # trusted publishing can be configured for it, so the first version is
      # always published by hand. Re-tagging that version would then fail here
      # on a duplicate, which is a confusing way to learn that the release
      # otherwise worked.
      - name: Is this version already on crates.io?
        id: existing
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if curl -sfH "User-Agent: onopen release workflow"                "https://crates.io/api/v1/crates/onopen/${version}" > /dev/null; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::onopen ${version} is already on crates.io; skipping the publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
        if: steps.existing.outputs.already == 'false'

      - name: Verify package contents
        if: steps.existing.outputs.already == 'false'
        run: cargo package --locked

      - name: Publish
        if: steps.existing.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
